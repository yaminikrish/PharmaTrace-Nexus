[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pharmatrace-nexus"
version = "2.4.0"
description = "Enterprise Multi-Tier Supply Chain Lot Traceability & Recall Simulation Suite"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Proprietary / Enterprise" }
authors = [
    { name = "PharmaTrace Architecture Team", email = "architecture@pharmatrace.nexus" }
]
keywords = [
    "traceability", "pharmaceutical", "supply-chain", "recall-simulation",
    "genealogy", "cgmp", "fda-part-7", "enterprise"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Manufacturing",
    "Intended Audience :: Healthcare Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: Libraries :: Application Frameworks"
]

[project.scripts]
pharmatrace = "pharmatrace.cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pharmatrace*"]
